version: 2

project_name: certkeeper

builds:
  - id: certkeeper
    main: ./cmd/certkeeper
    binary: certkeeper
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/rj9676564/certkeeper/internal/version.Version={{ .Version }}
      - -X github.com/rj9676564/certkeeper/internal/version.Commit={{ .Commit }}
      - -X github.com/rj9676564/certkeeper/internal/version.Date={{ .Date }}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
